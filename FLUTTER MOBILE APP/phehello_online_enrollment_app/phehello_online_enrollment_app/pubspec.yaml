name: phehello_online_enrollment_app
description: "Phehello Secondary School - Online Enrolment System (Parent/Guardian mobile app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  file_picker: ^8.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.0
  printing: ^5.14.3
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/env/app.env

dependency_overrides:
  image: 4.5.4
